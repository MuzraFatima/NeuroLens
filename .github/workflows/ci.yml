name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.4.0

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy>=1.24.0 scipy>=1.10.0 pandas>=2.0.0 matplotlib>=3.7.0 PyYAML>=6.0 python-pptx>=0.6.21 Pillow>=9.5.0
          pip install pytest>=7.4

      - name: Run core test suite
        run: python -m pytest tests/test_topocircuit.py -v --tb=short

      - name: Run production readiness tests
        run: python -m pytest tests/test_production_readiness.py -v --tb=short
